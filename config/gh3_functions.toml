# Fronteiras de funcao para o codegen do Guitar Hero III (imagem base, sem TU).
#
# Sao os 10 erros UnresolvedCall da ronda 1 (9 alvos distintos -- 0x8233E858
# aparece duas vezes, chamado de 0x821CF91C e 0x821CF938).
#
# Todas estas rotinas sao alcancadas apenas por tail call e nao constam do
# PDATA, por isso o rexglue nao lhes descobre o inicio sozinho. Nao e sinal de
# dump corrompido: e como o jogo foi compilado.
#
# 'end' e EXCLUSIVO (end = address + size) e nao pode coexistir com 'size' --
# ver rexglue-sdk-090/src/codegen/config.cpp:201-209.
#
# Cada fronteira foi obtida com:
#     python tools/xex_image.py ../extracted/default.xex --sweep <addr>
# que desencripta a imagem (AES-128, chave de sessao d4ef256c...) e varre da
# entrada ate ao terminador, passando por cima de terminadores que um ramo
# condicional anterior salte.

[functions]

# --- tabela de thunks, 4 instrucoes cada, espacadas 16 bytes -----------------
# Padrao identico nas quatro: carregam um ponteiro e saltam com bctr. Tem todo
# o aspeto de despacho por vtable/import.
"0x8232FDB0" = { end = 0x8232FDC0 }  # 4 instrucoes, termina em bctr
"0x8232FDC0" = { end = 0x8232FDD0 }  # 4 instrucoes, termina em bctr
"0x8232FDD0" = { end = 0x8232FDE0 }  # 4 instrucoes, termina em bctr
"0x8232FE90" = { end = 0x8232FEA0 }  # 4 instrucoes, termina em bctr

# --- wrappers minimos, ambos com tail call para a MESMA rotina --------------
"0x827A6C08" = { end = 0x827A6C10 }  # 2 instrucoes, tail call -> 0x82799DD0
"0x8279C110" = { end = 0x8279C118 }  # 2 instrucoes, tail call -> 0x82799DD0

# --- rotinas curtas ---------------------------------------------------------
"0x8233E858" = { end = 0x8233E870 }  # 6 instrucoes, termina em blr
"0x8236D0D8" = { end = 0x8236D0EC }  # 5 instrucoes, tail call -> 0x82415C78

# --- ronda 2: orfa encontrada em RUNTIME, nao no codegen ---------------------
# O codegen passou sem a reportar (nada lhe salta para la de forma estatica),
# mas o jogo bateu nela a arrancar:
#   [FATAL] Call to invalid or unregistered function at guest address 0x827C6AC8
# Chamada por ponteiro a partir do caminho de audio -- dai a analise estatica
# nao a apanhar.
#
# Nota sobre a varredura: ha um blr em 0x827C6AE8, mas o ramo condicional em
# 0x827C6ADC salta por cima dele (para 0x827C6AEC), por isso a funcao continua
# ate ao bctr em 0x827C6B0C. Monta 0x80070057 (E_INVALIDARG) no caminho curto.
"0x827C6AC8" = { end = 0x827C6B10 }  # 18 instrucoes, termina em bctr

# --- ronda 3: orfas encontradas por varrimento, ANTES de o jogo bater nelas --
# Achadas com tools/find_orphans.py, que procura ponteiros para a regiao de
# codigo dentro das regioes de DADOS e cruza com as 59.484 funcoes ja emitidas.
#
# Dos 118 candidatos plausiveis, so estao aqui os 9 com DUAS OU MAIS
# referencias. Referencia unica e sinal fraco (pode ser coincidencia de bytes)
# e nao vale o risco de declarar como funcao algo que e miolo de outra; esses
# ficam para tratamento reativo, se o jogo la bater.
#
# Validacao do metodo: o 0x826E0588 abaixo era precisamente a orfa que estava a
# matar o arranque, e o varrimento encontrou-a sozinho, com 11 referencias.
"0x821F31F8" = { end = 0x821F31FC }  # 1 instr, blr   -- stub vazio, 50 refs
"0x823F3BA8" = { end = 0x823F3BFC }  # 21 instr, bctr -- despacho, 86 refs
"0x826E0588" = { end = 0x826E0600 }  # 30 instr, blr  -- o FATAL da ronda 2, 11 refs
"0x827C6B10" = { end = 0x827C6B48 }  # 14 instr, blr  -- vizinha da 0x827C6AC8, 5 refs
"0x82208160" = { end = 0x82208168 }  # 2 instr, tail call, 3 refs
"0x82746A08" = { end = 0x82746A48 }  # 16 instr, tail call, 3 refs
"0x82311930" = { end = 0x82311934 }  # 1 instr, tail call, 2 refs
"0x8233B0B8" = { end = 0x8233B0BC }  # 1 instr, blr, 2 refs
"0x8237A018" = { end = 0x8237A024 }  # 3 instr, blr, 2 refs

# --- ronda 4: consequencia de um truncamento --------------------------------
# Ao resolver sobreposicoes, o 0x824317EC foi cortado de 0x82431D2C para
# 0x824319DC, e o 0x824319DC acaba em 0x82431AE8. Isso deixou este terceiro
# ponto de entrada do mesmo bloco a descoberto, e o Validate apanhou-o:
#   0x82431B1C from 0x824319C4 - target not in any function
# Nao se sobrepoe a nenhum dos vizinhos (ha uma folga 0x82431AE8-0x82431B1C).
"0x82431B1C" = { end = 0x82431D2C }  # 132 instrucoes, tail call -> 0x824317D4

# --- ronda 5: so aparece com comando ligado ---------------------------------
# O varrimento nao a propoe (nao ha ponteiro para ela nas regioes de dados) e o
# jogo so la chega depois de ver um comando na slot 0, ja passado o carregamento
# de saves. Com mnk_mode=false o codigo nunca era alcancado.
"0x825E9B20" = { end = 0x825E9B44 }  # 9 instrucoes, termina em bctr

# --- bloco de comparacao/laco, o unico grande -------------------------------
# Comeca em rlwinm/cmpli/bc (sem prologo: e um alvo de salto, nao uma funcao
# chamada com bl). Termina em 'b 0x8211904C', um ramo para tras do laco.
# A fronteira esta confirmada de forma independente: em 0x821190B8 esta
# 7D8802A6 = mflr r12, ou seja o prologo da funcao seguinte comeca ali.
"0x82118F94" = { end = 0x821190B8 }  # 73 instrucoes

# --- ronda 6: XEX do usuario (nao USA Rev 1) --------------------------------
# Alvos UnresolvedCall da ronda 1 do codegen com o XEX do usuario
# (SHA dd2ca1ab..., entry 0x82136950), apos 439,1 s de analise, 0 ficheiros
# gerados. Fronteiras obtidas com:
#     python tools/xex_image.py ../extracted/default.xex --sweep <addr>
# 'end' e EXCLUSIVO, como nas rondas anteriores. Nenhum alvo cai DENTRO de
# uma funcao ja declarada nos dois tomls; a unica sobreposicao foi tratada
# por truncamento (ver 0x8249E9DC abaixo). gh3_orphans_scan.toml NAO foi
# tocado (ficheiro gerado) e o manifest NAO foi alterado.
"0x8279BC60" = { end = 0x8279BC68 }  # 2 instr, b 0x82799920 -- chamado de 0x8279CAA4
"0x82360110" = { end = 0x82360124 }  # 5 instr, b 0x824157F8 -- chamado de 0x8222B9D8
"0x827AC3C4" = { end = 0x827AC444 }  # 32 instr, blr -- chamado de 0x827AC3AC
"0x82431AF8" = { end = 0x82431B0C }  # 5 instr, b 0x8248EB9C -- chamado de 0x82431AA0; cabe na folga 0x82431AE8-0x82431B1C entre as funcoes vizinhas
"0x82331890" = { end = 0x823318A8 }  # 6 instr, blr -- chamado de 0x821C0CD8 e 0x821C0CBC
"0x824A12E0" = { end = 0x824A142C }  # 83 instr, b 0x8248EBA0 -- chamado de 0x824A12CC
# TRUNCADO: o sweep deu end 0x8249EA60 (33 instr, b 0x8248EBAC), mas isso
# sobrepor-se-ia a entrada 0x8249E9EC de gh3_orphans_scan.toml. Neste XEX,
# 0x8249E9EC nao e um thunk separado como na USA Rev 1: e o cabecalho do
# laco dentro do bloco varrido (o ramo em 0x8249E9F8 volta para la, e o
# bloco continua ate ao b 0x8248EBAC em 0x8249EA5C). Como o orphans_scan nao
# pode ser editado, corta-se aqui como nas rondas anteriores: ficam 4
# instrucoes, terminando no b 0x8249E9F0 em 0x8249E9E8. Se a ronda 2
# reportar chamadas sem funcao a partir deste bloco, e este truncamento
# que tem de ser revisto (e, em ultimo caso, a entrada 0x8249E9EC).
"0x8249E9DC" = { end = 0x8249E9EC }  # 4 instr (truncado de 33), b 0x8249E9F0 -- chamado de 0x8249E8B0
"0x821EECA0" = { end = 0x821EECBC }  # 7 instr, b 0x8248EB80 -- chamado de 0x821EEC48
"0x8232C458" = { end = 0x8232C468 }  # 4 instr, bctr -- chamado de 0x8225BC7C
"0x8232C378" = { end = 0x8232C388 }  # 4 instr, bctr -- chamado de 0x8225B8FC
"0x827A6758" = { end = 0x827A6760 }  # 2 instr, b 0x82799920 -- chamado de 0x827A6B34
"0x8232C388" = { end = 0x8232C398 }  # 4 instr, bctr -- chamado de 0x8225B914
"0x8232C398" = { end = 0x8232C3A8 }  # 4 instr, bctr -- chamado de 0x8225B92C
